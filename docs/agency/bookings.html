<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="Every booking this storefront has issued.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://railhead-demo.example/agency/bookings.html">
<meta property="og:title" content="Bookings — Agency console">
<meta property="og:description" content="Every booking this storefront has issued.">
<meta property="og:type" content="website">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../assets/img/icon-180.png">
<link rel="preload" href="../assets/fonts/publicsans-latin-300-800-n.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/archivo-latin-400-800-n.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="../assets/css/tokens.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/print.css" media="print">
<!-- The module graph is a waterfall: the page fetches its script, which imports
     ui.js, which imports theme.js and data.js, each a separate round trip before
     anything can render. Declaring them up front collapses that, and the two
     JSON files the first paint depends on are fetched in parallel with it. -->
<link rel="modulepreload" href="../assets/js/pages/agency.js">
<link rel="modulepreload" href="../assets/js/ui.js">
<link rel="modulepreload" href="../assets/js/theme.js">
<link rel="modulepreload" href="../assets/js/data.js">
<link rel="preload" href="../data/tenants.json" as="fetch" crossorigin>
<link rel="preload" href="../data/stations.json" as="fetch" crossorigin>
<script>
/* Paint the storefront's brand colour before first paint, so the page does not
   flash the house palette and then repaint. */
(function () {
  try {
    var t = new URLSearchParams(location.search).get('tenant') || localStorage.getItem('railhead.tenant');
    if (t) document.documentElement.dataset.tenant = t;
    var c = localStorage.getItem('railhead.brandcache');
    if (c) {
      c = JSON.parse(c);
      if (c.id === t) {
        var r = document.documentElement.style;
        for (var k in c.vars) r.setProperty(k, c.vars[k]);
      }
    }
  } catch (e) { /* private mode: fall through to the default palette */ }
})();
</script>
</head>
<body data-nav="" data-depth="1" data-page="agency/bookings">
<a class="skip-link" href="#main">Skip to content</a>

<section class="band band-tight" aria-labelledby="ac-title">
  <div class="wrap wrap-wide">
    <span class="eyebrow">Agency console</span>
    <h1 id="ac-title" style="font-size:var(--step-3)">Bookings</h1>
    <nav class="tabs mt-6" id="console-nav" aria-label="Console sections"></nav>
    <div id="console" data-screen="bookings"></div>
  </div>
</section>
</main>
<footer id="site-footer" class="site-footer"></footer>
<script type="module" src="../assets/js/pages/agency.js"></script>
</body>
</html>
